<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 06 - Preformatted Text (pre).html
    GOAL:
    - Learn <pre>
    - Understand whitespace preservation
  -->

  <meta charset="UTF-8" />
  <title>CH02 - Preformatted Text</title>

  <style>
    body { font-family: Arial; padding: 20px; }
    .box { border: 2px dashed #666; padding: 12px; margin-top: 12px; }
  </style>
</head>

<body>

  <h1>CH02 - Preformatted Text (pre)</h1>

  <p>
    Normally, HTML ignores extra spaces and line breaks.
    But <code>&lt;pre&gt;</code> preserves formatting.
  </p>

  <div class="box">

    <pre>
Line 1
      Line 2 (indented)
          Line 3 (more indented)

Spacing     is     preserved.
    </pre>

  </div>

  <p>
    Commonly used for:
  </p>

  <ul>
    <li>Code display</li>
    <li>ASCII art</li>
    <li>Poetry formatting</li>
  </ul>

</body>
</html>
