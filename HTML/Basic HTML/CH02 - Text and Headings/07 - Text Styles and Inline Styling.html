<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 07 - Text Styles and Inline Styling.html
    GOAL:
    - Learn style attribute
    - Change color, size, alignment
  -->

  <meta charset="UTF-8" />
  <title>CH02 - Inline Text Styling</title>

  <style>
    body { font-family: Arial; padding: 20px; }
    .box { border: 2px dashed #666; padding: 12px; margin-top: 12px; }
  </style>
</head>

<body>

  <h1>CH02 - Text Styles (Inline Styling)</h1>

  <div class="box">

    <!-- Change text color -->
    <p style="color: red;">
      This text is red.
    </p>

    <!-- Change font size -->
    <p style="font-size: 24px;">
      This text is larger.
    </p>

    <!-- Change background color -->
    <p style="background-color: yellow;">
      This text has a yellow background.
    </p>

    <!-- Text alignment -->
    <p style="text-align: center;">
      This text is centered.
    </p>

  </div>

  <p>
    ⚠ Note:
    Inline styling is useful for learning.
    Later we will use CSS properly.
  </p>

</body>
</html>
