<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sorting Visualizer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/565/565547.png" />
</head>
<body>
  <div id="snow"></div>

  <header class="topbar">
    <h1>Sorting Visualizer</h1>
    <p class="subtitle">Enter numbers, choose a sort, watch the process (numbers swap in real-time).</p>
  </header>

  <main class="container">
    <section class="controls">
      <div class="left-controls">
        <input id="numberInput" type="number" placeholder="Enter number" />
        <button id="addBtn">Add</button>
        <button id="randomBtn">Random</button>
        <button id="clearBtn">Clear</button>
      </div>

      <div class="right-controls">
        <label>
          Method
          <select id="sortMethod">
            <option value="bubble">Bubble Sort</option>
            <option value="selection">Selection Sort</option>
            <option value="insertion">Insertion Sort</option>
            <option value="merge">Merge Sort</option>
            <option value="quick">Quick Sort</option>
          </select>
        </label>

        <label>
          Order
          <select id="order">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </label>

        <label>
          Process
          <select id="showProcess">
            <option value="yes">Show Process</option>
            <option value="no">Skip Process</option>
          </select>
        </label>

        <label>
          Speed
          <input id="speedRange" type="range" min="50" max="1000" value="350" />
        </label>

        <button id="sortBtn" class="primary">Sort</button>
      </div>
    </section>

    <section id="arrayContainer" class="number-boxes" aria-label="Array display"></section>

    <section class="legend">
      <div><span class="legend-box highlight small"></span> Comparing</div>
      <div><span class="legend-box swap small"></span> Swapped</div>
    </section>
  </main>

  <footer class="footer">
    <small>Designed for interactive sorting demonstrations — numbers swap immediately when swapped.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
