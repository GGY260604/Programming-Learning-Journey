<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f5f2;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    .mobile-container {
      width: 100%;
      min-height: 100%;
      background: #f8f5f2;
      overflow-y: auto;
      padding-bottom: 80px;
    }

    /* Header */
    .header {
      background: #2d1810;
      color: #fff;
      padding: 20px 20px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .shop-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .cart-icon {
      position: relative;
      cursor: pointer;
      padding: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      transition: background 0.2s;
    }

    .cart-icon:hover {
      background: rgba(255,255,255,0.2);
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #e67e22;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .tagline {
      font-size: 13px;
      opacity: 0.8;
      letter-spacing: 0.3px;
    }

    /* Promo Banner */
    .promo-banner {
      background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
      color: white;
      padding: 14px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 8px rgba(230,126,34,0.3);
    }

    /* Categories */
    .categories {
      padding: 20px 0 16px;
      background: white;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-chips {
      display: inline-flex;
      gap: 10px;
      padding: 0 20px;
    }

    .category-chip {
      padding: 10px 20px;
      background: #f8f5f2;
      border: 2px solid transparent;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      color: #2d1810;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .category-chip.active {
      background: #2d1810;
      color: white;
      border-color: #2d1810;
    }

    .category-chip:hover {
      border-color: #2d1810;
    }

    /* Products Grid */
    .products-section {
      padding: 20px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #2d1810;
      margin-bottom: 16px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #f8f5f2 0%, #e8e0d8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      position: relative;
    }

    .product-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e67e22;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 15px;
      font-weight: 700;
      color: #2d1810;
      margin-bottom: 4px;
    }

    .product-description {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: #e67e22;
    }

    .add-btn {
      background: #2d1810;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background: #1a0f0a;
      transform: scale(1.05);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px 20px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 12px;
      transition: background 0.2s;
      color: #666;
    }

    .nav-item:hover {
      background: #f8f5f2;
    }

    .nav-item.active {
      color: #e67e22;
    }

    .nav-icon {
      font-size: 24px;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
    }

    /* Cart Modal */
    .cart-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }

    .cart-modal.show {
      display: flex;
    }

    .cart-content {
      background: white;
      width: 100%;
      max-height: 80%;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .cart-title {
      font-size: 22px;
      font-weight: 700;
      color: #2d1810;
    }

    .close-cart {
      font-size: 28px;
      cursor: pointer;
      color: #666;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f8f5f2;
      transition: background 0.2s;
    }

    .close-cart:hover {
      background: #e8e0d8;
    }

    .cart-items {
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 16px;
      background: #f8f5f2;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .cart-item-image {
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-size: 15px;
      font-weight: 700;
      color: #2d1810;
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-size: 14px;
      color: #e67e22;
      font-weight: 600;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .quantity-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #2d1810;
      background: white;
      color: #2d1810;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .quantity-btn:hover {
      background: #2d1810;
      color: white;
    }

    .quantity-display {
      font-size: 15px;
      font-weight: 700;
      color: #2d1810;
      min-width: 24px;
      text-align: center;
    }

    .cart-total {
      padding: 20px;
      background: #f8f5f2;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .total-row.final {
      font-size: 20px;
      font-weight: 700;
      color: #2d1810;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid #e8e0d8;
    }

    .checkout-btn {
      width: 100%;
      padding: 16px;
      background: #e67e22;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkout-btn:hover {
      background: #d35400;
      transform: translateY(-2px);
    }

    .checkout-btn:active {
      transform: translateY(0);
    }

    .empty-cart {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .empty-cart-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-cart-text {
      font-size: 16px;
    }

    .footer {
      background: white;
      padding: 24px 20px;
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="mobile-container"><!-- Header -->
   <header class="header">
    <div class="header-top">
     <h1 class="shop-name" id="shop-name">Brew Haven</h1>
     <div class="cart-icon" id="cart-icon">
      🛒 <span class="cart-count" id="cart-count" style="display: none;">0</span>
     </div>
    </div>
    <p class="tagline" id="tagline">Artisan Coffee &amp; Fresh Pastries</p>
   </header><!-- Promo Banner -->
   <div class="promo-banner" id="promo-banner">
    ☕ Free delivery on orders over $20!
   </div><!-- Categories -->
   <nav class="categories">
    <div class="category-chips"><button class="category-chip active" data-category="all">All</button> <button class="category-chip" data-category="coffee">Coffee</button> <button class="category-chip" data-category="pastries">Pastries</button> <button class="category-chip" data-category="drinks">Drinks</button>
    </div>
   </nav><!-- Products Section -->
   <section class="products-section">
    <h2 class="section-title">Popular Items</h2>
    <div class="products-grid" id="products-grid"><!-- Products will be dynamically populated -->
    </div>
   </section><!-- Footer -->
   <footer class="footer" id="footer">
    <p>© 2024 Brew Haven. Made with love and coffee.</p>
   </footer>
  </div><!-- Bottom Navigation -->
  <nav class="bottom-nav">
   <div class="nav-item active"><span class="nav-icon">🏠</span> <span class="nav-label">Home</span>
   </div>
   <div class="nav-item"><span class="nav-icon">🔍</span> <span class="nav-label">Search</span>
   </div>
   <div class="nav-item"><span class="nav-icon">❤️</span> <span class="nav-label">Favorites</span>
   </div>
   <div class="nav-item"><span class="nav-icon">👤</span> <span class="nav-label">Profile</span>
   </div>
  </nav><!-- Cart Modal -->
  <div class="cart-modal" id="cart-modal">
   <div class="cart-content">
    <div class="cart-header">
     <h2 class="cart-title">Your Cart</h2>
     <div class="close-cart" id="close-cart">
      ×
     </div>
    </div>
    <div id="cart-items-container"></div>
   </div>
  </div>
  <script>
    const products = [
      { id: 1, name: 'Cappuccino', price: 4.50, emoji: '☕', category: 'coffee', description: 'Rich espresso with steamed milk', badge: 'Hot' },
      { id: 2, name: 'Croissant', price: 3.20, emoji: '🥐', category: 'pastries', description: 'Buttery, flaky perfection' },
      { id: 3, name: 'Iced Latte', price: 5.00, emoji: '🧊', category: 'coffee', description: 'Smooth espresso over ice', badge: 'Popular' },
      { id: 4, name: 'Blueberry Muffin', price: 3.80, emoji: '🧁', category: 'pastries', description: 'Fresh baked daily' },
      { id: 5, name: 'Green Tea', price: 3.50, emoji: '🍵', category: 'drinks', description: 'Organic matcha blend' },
      { id: 6, name: 'Chocolate Cake', price: 4.50, emoji: '🍰', category: 'pastries', description: 'Decadent chocolate layers' },
      { id: 7, name: 'Americano', price: 3.80, emoji: '☕', category: 'coffee', description: 'Bold espresso with water' },
      { id: 8, name: 'Orange Juice', price: 4.00, emoji: '🍊', category: 'drinks', description: 'Freshly squeezed', badge: 'New' }
    ];

    let cart = [];
    let activeCategory = 'all';

    const defaultConfig = {
      shop_name: 'Brew Haven',
      tagline: 'Artisan Coffee & Fresh Pastries',
      promo_text: '☕ Free delivery on orders over $20!',
      footer_text: '© 2024 Brew Haven. Made with love and coffee.',
      background_color: '#f8f5f2',
      surface_color: '#ffffff',
      text_color: '#2d1810',
      primary_action_color: '#e67e22',
      secondary_action_color: '#2d1810',
      font_family: '-apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto',
      font_size: 16
    };

    async function onConfigChange(config) {
      const shopName = config.shop_name || defaultConfig.shop_name;
      const tagline = config.tagline || defaultConfig.tagline;
      const promoText = config.promo_text || defaultConfig.promo_text;
      const footerText = config.footer_text || defaultConfig.footer_text;
      const bgColor = config.background_color || defaultConfig.background_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
      const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;
      const fontFamily = config.font_family || defaultConfig.font_family;
      const fontSize = config.font_size || defaultConfig.font_size;

      document.getElementById('shop-name').textContent = shopName;
      document.getElementById('tagline').textContent = tagline;
      document.getElementById('promo-banner').textContent = promoText;
      document.getElementById('footer').innerHTML = `<p>${footerText}</p>`;

      document.body.style.fontFamily = `${fontFamily}, sans-serif`;
      document.body.style.fontSize = `${fontSize}px`;
      
      const mobileContainer = document.querySelector('.mobile-container');
      mobileContainer.style.background = bgColor;
      
      const allSurfaces = document.querySelectorAll('.product-card, .categories, .cart-content, .bottom-nav, .footer, .cart-item-image');
      allSurfaces.forEach(el => el.style.background = surfaceColor);
      
      const header = document.querySelector('.header');
      header.style.background = secondaryColor;
      
      const allText = document.querySelectorAll('.shop-name, .section-title, .product-name, .cart-title, .cart-item-name, .total-row.final');
      allText.forEach(el => el.style.color = textColor);
      
      const promoBanner = document.querySelector('.promo-banner');
      promoBanner.style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${adjustColor(primaryColor, -20)} 100%)`;
      
      const allPrimaryBtns = document.querySelectorAll('.checkout-btn, .product-price, .cart-item-price, .nav-item.active');
      allPrimaryBtns.forEach(el => el.style.color = primaryColor);
      
      const checkoutBtn = document.querySelector('.checkout-btn');
      checkoutBtn.style.background = primaryColor;
      
      const allSecondaryBtns = document.querySelectorAll('.add-btn, .category-chip.active');
      allSecondaryBtns.forEach(el => {
        el.style.background = secondaryColor;
        el.style.color = surfaceColor;
      });
    }

    function adjustColor(color, amount) {
      const num = parseInt(color.replace('#', ''), 16);
      const r = Math.max(0, Math.min(255, (num >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
      const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
      return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      const filteredProducts = activeCategory === 'all' 
        ? products 
        : products.filter(p => p.category === activeCategory);

      grid.innerHTML = filteredProducts.map(product => `
        <div class="product-card">
          <div class="product-image">
            ${product.emoji}
            ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
          </div>
          <div class="product-info">
            <h3 class="product-name">${product.name}</h3>
            <p class="product-description">${product.description}</p>
            <div class="product-footer">
              <span class="product-price">$${product.price.toFixed(2)}</span>
              <button class="add-btn" data-id="${product.id}">Add</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      const countEl = document.getElementById('cart-count');
      if (count > 0) {
        countEl.textContent = count;
        countEl.style.display = 'block';
      } else {
        countEl.style.display = 'none';
      }
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);
      
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      
      updateCartCount();
    }

    function updateQuantity(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.id !== productId);
        }
        updateCartCount();
        renderCart();
      }
    }

    function renderCart() {
      const container = document.getElementById('cart-items-container');
      
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">🛒</div>
            <p class="empty-cart-text">Your cart is empty</p>
          </div>
        `;
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const tax = subtotal * 0.08;
      const total = subtotal + tax;

      container.innerHTML = `
        <div class="cart-items">
          ${cart.map(item => `
            <div class="cart-item">
              <div class="cart-item-image">${item.emoji}</div>
              <div class="cart-item-info">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                <div class="cart-item-controls">
                  <button class="quantity-btn" data-id="${item.id}" data-delta="-1">−</button>
                  <span class="quantity-display">${item.quantity}</span>
                  <button class="quantity-btn" data-id="${item.id}" data-delta="1">+</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="cart-total">
          <div class="total-row">
            <span>Subtotal</span>
            <span>$${subtotal.toFixed(2)}</span>
          </div>
          <div class="total-row">
            <span>Tax (8%)</span>
            <span>$${tax.toFixed(2)}</span>
          </div>
          <div class="total-row final">
            <span>Total</span>
            <span>$${total.toFixed(2)}</span>
          </div>
        </div>
        <button class="checkout-btn">Proceed to Checkout</button>
      `;
    }

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('add-btn')) {
        const id = parseInt(e.target.dataset.id);
        addToCart(id);
      }

      if (e.target.classList.contains('category-chip')) {
        document.querySelectorAll('.category-chip').forEach(chip => {
          chip.classList.remove('active');
        });
        e.target.classList.add('active');
        activeCategory = e.target.dataset.category;
        renderProducts();
      }

      if (e.target.classList.contains('quantity-btn')) {
        const id = parseInt(e.target.dataset.id);
        const delta = parseInt(e.target.dataset.delta);
        updateQuantity(id, delta);
      }

      if (e.target.id === 'cart-icon' || e.target.closest('#cart-icon')) {
        document.getElementById('cart-modal').classList.add('show');
        renderCart();
      }

      if (e.target.id === 'close-cart' || e.target.classList.contains('cart-modal')) {
        document.getElementById('cart-modal').classList.remove('show');
      }
    });

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (value) => {
                config.surface_color = value;
                window.elementSdk.setConfig({ surface_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.primary_action_color || defaultConfig.primary_action_color,
              set: (value) => {
                config.primary_action_color = value;
                window.elementSdk.setConfig({ primary_action_color: value });
              }
            },
            {
              get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
              set: (value) => {
                config.secondary_action_color = value;
