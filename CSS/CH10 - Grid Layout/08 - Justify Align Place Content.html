<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 08 - Justify Align Place Content.html
    TOPIC: CH10 - Grid Layout

    GOAL:
    - Learn justify-content.
    - Learn align-content.
    - Learn place-content.
    - Understand how to align the whole grid inside the container.

    IMPORTANT:
    - justify-items aligns items inside cells.
    - justify-content aligns the whole grid horizontally inside the container.
    - align-items aligns items inside cells.
    - align-content aligns the whole grid vertically inside the container.
    - place-content is shorthand for align-content and justify-content.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CH10 - Justify Align Place Content</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
      line-height: 1.6;
    }

    .box {
      background-color: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-template-rows: repeat(2, 60px);
      gap: 10px;
      width: 500px;
      height: 220px;
      background-color: #eeeeee;
      border: 2px dashed #777;
      padding: 12px;
      margin-bottom: 12px;
    }

    .item {
      background-color: #eaf0ff;
      border: 2px solid #0057d9;
      text-align: center;
      font-weight: bold;
      padding-top: 14px;
    }

    .justify-end {
      justify-content: end;
    }

    .align-center {
      align-content: center;
    }

    .place-center {
      place-content: center;
    }

    code {
      background-color: #eeeeee;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <h1>justify-content, align-content and place-content</h1>

  <div class="box">
    <h2>justify-content: end</h2>

    <div class="grid justify-end">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>

    <p>
      The whole grid is pushed to the right side of the container.
    </p>
  </div>

  <div class="box">
    <h2>align-content: center</h2>

    <div class="grid align-center">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>
  </div>

  <div class="box">
    <h2>place-content: center</h2>

    <div class="grid place-center">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>

    <p>
      The whole grid is centered horizontally and vertically.
    </p>
  </div>

</body>
</html>
