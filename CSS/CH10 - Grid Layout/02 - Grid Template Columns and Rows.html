<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 02 - Grid Template Columns and Rows.html
    TOPIC: CH10 - Grid Layout

    GOAL:
    - Learn grid-template-columns.
    - Learn grid-template-rows.
    - Understand fixed size, percentage, and fr unit.

    IMPORTANT:
    - grid-template-columns controls column structure.
    - grid-template-rows controls row structure.
    - fr means fraction of available space.
    - 1fr 1fr 1fr means three equal columns.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CH10 - Grid Template Columns and Rows</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
      line-height: 1.6;
    }

    .box {
      background-color: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      gap: 10px;
      background-color: #eeeeee;
      border: 2px dashed #777;
      padding: 12px;
      margin-bottom: 12px;
    }

    .item {
      background-color: #eaf0ff;
      border: 2px solid #0057d9;
      padding: 14px;
      text-align: center;
      font-weight: bold;
    }

    /*
      Fixed columns:
      - Each column has a specific pixel width.
    */
    .fixed-columns {
      grid-template-columns: 120px 180px 120px;
    }

    /*
      Fraction columns:
      - The available space is divided by fractions.
      - The middle column gets twice the space.
    */
    .fraction-columns {
      grid-template-columns: 1fr 2fr 1fr;
    }

    /*
      Mixed columns:
      - First column is fixed.
      - Second column takes remaining available space.
      - Third column is fixed.
    */
    .mixed-columns {
      grid-template-columns: 150px 1fr 100px;
    }

    /*
      Rows:
      - grid-template-rows controls the height of each row.
    */
    .row-demo {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 80px 140px;
    }

    code {
      background-color: #eeeeee;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <h1>grid-template-columns and grid-template-rows</h1>

  <div class="box">
    <h2>Fixed Columns</h2>

    <div class="grid fixed-columns">
      <div class="item">120px</div>
      <div class="item">180px</div>
      <div class="item">120px</div>
    </div>
  </div>

  <div class="box">
    <h2>Fraction Columns</h2>

    <div class="grid fraction-columns">
      <div class="item">1fr</div>
      <div class="item">2fr</div>
      <div class="item">1fr</div>
    </div>

    <p>
      The middle column is wider because it uses <code>2fr</code>.
    </p>
  </div>

  <div class="box">
    <h2>Mixed Columns</h2>

    <div class="grid mixed-columns">
      <div class="item">150px</div>
      <div class="item">1fr</div>
      <div class="item">100px</div>
    </div>
  </div>

  <div class="box">
    <h2>Template Rows</h2>

    <div class="grid row-demo">
      <div class="item">Row 1</div>
      <div class="item">Row 1</div>
      <div class="item">Row 1</div>
      <div class="item">Row 2</div>
      <div class="item">Row 2</div>
      <div class="item">Row 2</div>
    </div>
  </div>

</body>
</html>
