<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 05 - Grid Column and Row Placement.html
    TOPIC: CH10 - Grid Layout

    GOAL:
    - Learn grid-column.
    - Learn grid-row.
    - Understand grid line numbers.
    - Make items span multiple columns or rows.

    IMPORTANT:
    - Grid lines are the dividing lines between columns and rows.
    - grid-column: 1 / 3 means start at column line 1 and end at column line 3.
    - span can be used to say how many tracks the item should cover.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CH10 - Grid Column and Row Placement</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
      line-height: 1.6;
    }

    .box {
      background-color: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 80px);
      gap: 10px;
      background-color: #eeeeee;
      border: 2px dashed #777;
      padding: 12px;
    }

    .item {
      background-color: #eaf0ff;
      border: 2px solid #0057d9;
      padding: 12px;
      text-align: center;
      font-weight: bold;
    }

    /*
      This item starts at column line 1 and ends at column line 3.
      That means it spans two columns.
    */
    .wide-item {
      grid-column: 1 / 3;
      background-color: #eaffea;
      border-color: green;
    }

    /*
      This item spans two rows.
    */
    .tall-item {
      grid-row: span 2;
      background-color: #fff4d6;
      border-color: orange;
    }

    /*
      This item uses both grid-column and grid-row.
    */
    .large-item {
      grid-column: 3 / 5;
      grid-row: 2 / 4;
      background-color: #ffe5e5;
      border-color: red;
    }

    code {
      background-color: #eeeeee;
      padding: 2px 6px;
      border-radius: 4px;
    }

    pre {
      background-color: #222;
      color: white;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <h1>grid-column and grid-row</h1>

  <div class="box">
    <h2>Manual Item Placement</h2>

    <div class="grid">
      <div class="item wide-item">
        grid-column: 1 / 3
      </div>

      <div class="item">
        Normal
      </div>

      <div class="item tall-item">
        grid-row: span 2
      </div>

      <div class="item">
        Normal
      </div>

      <div class="item large-item">
        column 3 / 5
        <br>
        row 2 / 4
      </div>

      <div class="item">
        Normal
      </div>
    </div>

    <pre>
.wide-item {
  grid-column: 1 / 3;
}

.tall-item {
  grid-row: span 2;
}</pre>
  </div>

</body>
</html>
