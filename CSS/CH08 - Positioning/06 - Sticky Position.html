<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 06 - Sticky Position.html
    TOPIC: CH08 - Positioning

    GOAL:
    - Understand position: sticky.
    - Learn that sticky behaves like relative first, then fixed after scrolling.
    - Create sticky section headings.

    IMPORTANT:
    - Positioning controls where an element is placed on the page.
    - top, right, bottom, and left work only on positioned elements.
    - A positioned element means position is relative, absolute, fixed, or sticky.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CH08 - Sticky Position</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
      line-height: 1.6;
    }

    .box {
      background-color: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .demo-area {
      background-color: #eeeeee;
      border: 2px dashed #777;
      padding: 12px;
      margin-bottom: 16px;
    }

    code {
      background-color: #eeeeee;
      padding: 2px 6px;
      border-radius: 4px;
    }

    pre {
      background-color: #222;
      color: white;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
    }


    .sticky-title {
      position: sticky;
      top: 0;
      background-color: #0057d9;
      color: white;
      padding: 12px;
      border-radius: 8px;
      z-index: 5;
    }

    .section {
      background-color: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .paragraph-block {
      background-color: #eaf0ff;
      border: 2px solid #0057d9;
      padding: 16px;
      margin-bottom: 16px;
      min-height: 140px;
    }

  </style>
</head>

<body>


  <h1>position: sticky</h1>

  <div class="box">
    <h2>Sticky behavior</h2>

    <p>
      Scroll down and observe the section titles.
      A sticky element behaves like normal content first,
      then it sticks when it reaches the defined offset.
    </p>
  </div>

  <section class="section">
    <h2 class="sticky-title">Sticky Section A</h2>
    <div class="paragraph-block">Content A1</div>
    <div class="paragraph-block">Content A2</div>
    <div class="paragraph-block">Content A3</div>
  </section>

  <section class="section">
    <h2 class="sticky-title">Sticky Section B</h2>
    <div class="paragraph-block">Content B1</div>
    <div class="paragraph-block">Content B2</div>
    <div class="paragraph-block">Content B3</div>
  </section>

</body>
</html>
