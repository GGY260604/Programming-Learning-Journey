<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 08 - Z Index and Stacking.html
    TOPIC: CH08 - Positioning

    GOAL:
    - Understand z-index.
    - Learn how z-index controls stacking order.
    - Understand that z-index works on positioned elements.

    IMPORTANT:
    - Positioning controls where an element is placed on the page.
    - top, right, bottom, and left work only on positioned elements.
    - A positioned element means position is relative, absolute, fixed, or sticky.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CH08 - Z Index and Stacking</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
      line-height: 1.6;
    }

    .box {
      background-color: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .demo-area {
      background-color: #eeeeee;
      border: 2px dashed #777;
      padding: 12px;
      margin-bottom: 16px;
    }

    code {
      background-color: #eeeeee;
      padding: 2px 6px;
      border-radius: 4px;
    }

    pre {
      background-color: #222;
      color: white;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
    }


    .stack-area {
      position: relative;
      height: 260px;
      background-color: #eeeeee;
      border: 2px dashed #777;
      margin-bottom: 16px;
    }

    .stack-box {
      position: absolute;
      width: 180px;
      height: 120px;
      padding: 12px;
      color: white;
      font-weight: bold;
      border: 3px solid #333;
    }

    .box-one {
      top: 30px;
      left: 30px;
      background-color: #0057d9;
      z-index: 1;
    }

    .box-two {
      top: 70px;
      left: 90px;
      background-color: green;
      z-index: 2;
    }

    .box-three {
      top: 110px;
      left: 150px;
      background-color: red;
      z-index: 3;
    }

  </style>
</head>

<body>


  <h1>z-index and Stacking</h1>

  <div class="box">
    <h2>Stacking order</h2>

    <div class="stack-area">
      <div class="stack-box box-one">
        Blue box<br>z-index: 1
      </div>

      <div class="stack-box box-two">
        Green box<br>z-index: 2
      </div>

      <div class="stack-box box-three">
        Red box<br>z-index: 3
      </div>
    </div>

    <p>
      The red box appears in front because it has the largest z-index.
    </p>
  </div>

</body>
</html>
