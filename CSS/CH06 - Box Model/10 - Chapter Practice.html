<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 10 - Chapter Practice.html
    TOPIC: CH06 - Box Model

    GOAL:
    - Practice width, height, padding, margin, border, border-radius, box-sizing, and outline.
    - Build a simple pricing card layout using box model concepts.

    NOTE:
    - This file is executable. Open it directly in a browser.
    - Read the comments inside the CSS to understand each property.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>10 - Chapter Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
      line-height: 1.6;
    }

    .box {
      background-color: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    code {
      background-color: #eeeeee;
      padding: 2px 6px;
      border-radius: 4px;
    }

    pre {
      background-color: #222;
      color: white;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .page-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .pricing-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .pricing-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pricing-card {
      width: 260px;
      background-color: white;
      border: 2px solid #333;
      border-radius: 14px;
      padding: 20px;
    }

    .pricing-card.featured {
      border: 4px solid #0057d9;
      outline: 4px solid rgba(0, 87, 217, 0.2);
      outline-offset: 4px;
    }

    .plan-name {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      margin: 12px 0;
    }

    .features {
      padding-left: 20px;
      margin-bottom: 20px;
    }

    .features li {
      margin-bottom: 8px;
    }

    .button {
      display: block;
      text-align: center;
      color: white;
      background-color: #0057d9;
      border: 2px solid #0057d9;
      border-radius: 999px;
      padding: 10px 14px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background-color: #003f9e;
      border-color: #003f9e;
    }

  </style>
</head>

<body>

  <main class="pricing-wrapper">
    <h1 class="page-title">
      CH06 Practice: Pricing Cards
    </h1>

    <div class="pricing-row">

      <section class="pricing-card">
        <h2 class="plan-name">
          Basic
        </h2>

        <p class="price">
          RM 0
        </p>

        <ul class="features">
          <li>Simple layout</li>
          <li>Box model practice</li>
          <li>Readable spacing</li>
        </ul>

        <a href="#" class="button">
          Select
        </a>
      </section>

      <section class="pricing-card featured">
        <h2 class="plan-name">
          Pro
        </h2>

        <p class="price">
          RM 29
        </p>

        <ul class="features">
          <li>Featured border</li>
          <li>Outline highlight</li>
          <li>Rounded corners</li>
        </ul>

        <a href="#" class="button">
          Select
        </a>
      </section>

      <section class="pricing-card">
        <h2 class="plan-name">
          Team
        </h2>

        <p class="price">
          RM 59
        </p>

        <ul class="features">
          <li>Fixed card width</li>
          <li>Internal padding</li>
          <li>External spacing</li>
        </ul>

        <a href="#" class="button">
          Select
        </a>
      </section>

    </div>
  </main>

</body>
</html>
