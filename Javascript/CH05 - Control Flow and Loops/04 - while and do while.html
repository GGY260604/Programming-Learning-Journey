<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 04 - while and do while.html
    TOPIC: CH05 - Control Flow and Loops

    GOAL:
    - Learn while loop syntax.
    - Learn do while loop syntax.
    - Understand the difference between checking condition before and after running the loop body.

    IMPORTANT:
    - while checks the condition before running.
    - do while runs once first, then checks the condition.
    - Always update the loop value to avoid an infinite loop.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CH05 - while and do while</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>CH05 - Control Flow and Loops</h1>
  <h2>04 - while and do while</h2>

  <div class="section">
    <h3>Concept</h3>
    <p>
      A <code>while</code> loop is useful when you do not know exactly how many
      times the code should repeat, but you know the condition for continuing.
    </p>

    <p>
      A <code>do while</code> loop is similar, but it always runs at least once.
    </p>
  </div>

  <div class="section">
    <h3>Interactive Demo</h3>

    <div class="demo-grid">
      <div>
        <label for="limitInput">Limit</label>
        <input type="number" id="limitInput" value="3" min="0">
      </div>
    </div>

    <button onclick="runWhileLoop()">Run while Loop</button>
    <button onclick="runDoWhileLoop()">Run do while Loop</button>
    <button onclick="clearOutput()">Clear</button>

    <h3>Output</h3>
    <div id="output" class="output"></div>
  </div>

  <script>
    const output = document.getElementById("output");

    function print(message) {
      output.textContent += message + "\n";
    }

    function runWhileLoop() {
      output.textContent = "";

      const limit = Number(document.getElementById("limitInput").value);
      let count = 1;

      print("while loop result:");

      /*
        while checks the condition first.
        If limit is 0, this loop will not run at all.
      */
      while (count <= limit) {
        print("Count: " + count);

        /*
          This update is important.
          Without count++, the condition may remain true forever.
        */
        count++;
      }

      print("Finished.");
    }

    function runDoWhileLoop() {
      output.textContent = "";

      const limit = Number(document.getElementById("limitInput").value);
      let count = 1;

      print("do while loop result:");

      /*
        do while runs the block once before checking the condition.
        Even if limit is 0, this block still runs one time.
      */
      do {
        print("Count: " + count);
        count++;
      } while (count <= limit);

      print("Finished.");
    }

    function clearOutput() {
      output.textContent = "";
    }
  </script>
</body>
</html>
