<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 16 - Lifecycle Hooks and Template Refs.html
    TOPIC: CH19 - Vue.js

    GOAL:
    - Use common lifecycle hooks.
    - Use template refs to access DOM elements.
    - Understand when mounted() runs.

    IMPORTANT:
    - mounted() runs after the component is mounted to the page.
    - updated() runs after reactive data causes DOM updates.
    - Use refs only when direct DOM access is really needed.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>16 - Lifecycle Hooks and Template Refs</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CH19 - Vue.js</h1>
  <h2>16 - Lifecycle Hooks and Template Refs</h2>

  <div class="section">
    <h3>Concept</h3>

    <p>
      Lifecycle hooks let you run code at specific moments of a Vue component life.
    </p>
  </div>

  <div id="app" class="section" v-cloak>
    <h3>Lifecycle and Refs</h3>

    <p>Count: <strong>{{ count }}</strong></p>
    <button @click="count++">Increase</button>

    <label>
      Focus target:
      <input ref="nameInput" v-model="name" placeholder="Click focus button">
    </label>

    <button @click="focusInput">Focus Input</button>

    <h3>Log</h3>
    <div class="output">{{ log }}</div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          count: 0,
          name: "",
          log: ""
        };
      },
      mounted() {
        this.log += "mounted(): Vue app is connected to the page.\n";
      },
      updated() {
        this.log += "updated(): data changed and DOM updated.\n";
      },
      methods: {
        focusInput() {
          this.$refs.nameInput.focus();
          this.log += "The input was focused using this.$refs.nameInput.\n";
        }
      }
    }).mount("#app");

    /*
      Common Options API lifecycle hooks:

      beforeCreate()
      created()
      beforeMount()
      mounted()
      beforeUpdate()
      updated()
      beforeUnmount()
      unmounted()

      Template ref:
      <input ref="nameInput">

      Access it in JavaScript:
      this.$refs.nameInput
    */
  </script>
</body>
</html>
