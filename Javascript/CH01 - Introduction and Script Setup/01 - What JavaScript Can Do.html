<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 01 - What JavaScript Can Do.html
    TOPIC: CH01 - Introduction and Script Setup

    GOAL:
    - Understand what JavaScript can do in a web page.
    - Learn that JavaScript can change content, style, attributes, and classes.
    - Learn that JavaScript can react to user actions.

    IMPORTANT:
    - HTML creates the structure.
    - CSS controls the appearance.
    - JavaScript controls the behavior.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CH01 - What JavaScript Can Do</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>CH01 - Introduction and Script Setup</h1>
  <h2>01 - What JavaScript Can Do</h2>

  <div class="section">
    <h3>Concept</h3>

    <p>
      JavaScript is used to make a web page interactive.
      In this file, each button demonstrates one common JavaScript action.
    </p>
  </div>

  <div class="section">
    <h3>Demo Area</h3>

    <p id="message">This text can be changed by JavaScript.</p>

    <img
      id="picture"
      src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22180%22%20height%3D%22100%22%3E%3Crect%20width%3D%22180%22%20height%3D%22100%22%20fill%3D%22%23eeeeee%22%20stroke%3D%22%23333333%22%20stroke-width%3D%224%22/%3E%3Ctext%20x%3D%2290%22%20y%3D%2255%22%20font-size%3D%2218%22%20font-family%3D%22Arial%22%20text-anchor%3D%22middle%22%20fill%3D%22%23333333%22%3EOriginal%3C/text%3E%3C/svg%3E"
      alt="Original placeholder image"
    >

    <div id="box" class="demo-box">
      This box can change style or class.
    </div>

    <br>

    <input id="username" type="text" placeholder="Enter your name">

    <button onclick="changeText()">Change Text</button>
    <button onclick="changeImage()">Change Image</button>
    <button onclick="changeStyle()">Change Style</button>
    <button onclick="toggleClass()">Toggle Class</button>
    <button onclick="readInput()">Read Input</button>
    <button onclick="resetDemo()">Reset</button>

    <div id="output" class="output"></div>
  </div>

  <script>
    /*
      JavaScript can select HTML elements.

      document.getElementById("message") means:
      - Find the element that has id="message".
      - Return that element so JavaScript can use it.
    */
    const message = document.getElementById("message");
    const picture = document.getElementById("picture");
    const box = document.getElementById("box");
    const username = document.getElementById("username");
    const output = document.getElementById("output");

    /*
      Function names should describe the action clearly.
      A function only runs when it is called.
    */
    function changeText() {
      /*
        textContent changes the text inside an element.
        It treats the value as plain text, not HTML code.
      */
      message.textContent = "The paragraph text has been changed by JavaScript.";
      output.textContent = "Action: Changed text using textContent.";
    }

    function changeImage() {
      /*
        src is an HTML attribute.
        JavaScript can change attributes through element properties.
      */
      picture.src = "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22180%22%20height%3D%22100%22%3E%3Crect%20width%3D%22180%22%20height%3D%22100%22%20fill%3D%22%23d4edda%22%20stroke%3D%22%23198754%22%20stroke-width%3D%224%22/%3E%3Ctext%20x%3D%2290%22%20y%3D%2255%22%20font-size%3D%2218%22%20font-family%3D%22Arial%22%20text-anchor%3D%22middle%22%20fill%3D%22%23198754%22%3EChanged%3C/text%3E%3C/svg%3E";
      picture.alt = "Changed placeholder image";
      output.textContent = "Action: Changed image src and alt attributes.";
    }

    function changeStyle() {
      /*
        The style property changes inline CSS.

        CSS property names with hyphens become camelCase in JavaScript.
        Example:
        background-color becomes backgroundColor.
      */
      box.style.backgroundColor = "#d4edda";
      box.style.borderColor = "green";
      box.style.color = "green";
      output.textContent = "Action: Changed style using the style property.";
    }

    function toggleClass() {
      /*
        classList.toggle() adds the class if it does not exist.
        It removes the class if it already exists.
      */
      box.classList.toggle("highlight");
      output.textContent = "Action: Toggled a CSS class using classList.toggle().";
    }

    function readInput() {
      /*
        input.value gets the current value typed by the user.
        trim() removes extra spaces from the beginning and end.
      */
      const name = username.value.trim();

      if (name === "") {
        output.textContent = "Please enter a name first.";
      } else {
        output.textContent = "Hello, " + name + "! JavaScript read your input value.";
      }
    }

    function resetDemo() {
      message.textContent = "This text can be changed by JavaScript.";

      picture.src = "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22180%22%20height%3D%22100%22%3E%3Crect%20width%3D%22180%22%20height%3D%22100%22%20fill%3D%22%23eeeeee%22%20stroke%3D%22%23333333%22%20stroke-width%3D%224%22/%3E%3Ctext%20x%3D%2290%22%20y%3D%2255%22%20font-size%3D%2218%22%20font-family%3D%22Arial%22%20text-anchor%3D%22middle%22%20fill%3D%22%23333333%22%3EOriginal%3C/text%3E%3C/svg%3E";
      picture.alt = "Original placeholder image";

      box.className = "demo-box";
      box.removeAttribute("style");

      username.value = "";
      output.textContent = "Demo has been reset.";
    }
  </script>
</body>
</html>
