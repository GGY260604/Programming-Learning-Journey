<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 05 - parseInt parseFloat and Number.html
    TOPIC: CH04 - String Number Math and Date

    GOAL:
    - Learn the difference between Number(), parseInt(), and parseFloat().
    - Understand how each one converts strings to numbers.
    - Learn when conversion returns NaN.

    IMPORTANT:
    - Number() expects the whole value to be a valid number format.
    - parseInt() reads an integer from the beginning of a string.
    - parseFloat() reads a decimal number from the beginning of a string.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CH04 - parseInt parseFloat and Number</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>CH04 - String Number Math and Date</h1>
  <h2>05 - parseInt, parseFloat, and Number</h2>

  <div class="section">
    <h3>Concept</h3>
    <p>
      These three tools convert values into numbers, but they do not behave exactly the same.
    </p>
  </div>

  <div class="section">
    <h3>Conversion Tester</h3>

    <label for="valueInput">Enter a value</label>
    <input type="text" id="valueInput" value="123.45px">

    <button onclick="convertValue()">Convert</button>
    <button onclick="loadExample('42')">42</button>
    <button onclick="loadExample('42px')">42px</button>
    <button onclick="loadExample('3.14kg')">3.14kg</button>
    <button onclick="loadExample('hello')">hello</button>
    <button onclick="loadExample('')">empty string</button>
    <button onclick="clearOutput()">Clear</button>

    <h3>Output</h3>
    <div id="output" class="output"></div>
  </div>

  <script>
    const output = document.getElementById("output");
    const valueInput = document.getElementById("valueInput");

    function convertValue() {
      const value = valueInput.value;

      /*
        Number(value):
        Converts the entire value to a number.
        If the whole value is not a valid number, the result is NaN.
      */
      const numberResult = Number(value);

      /*
        parseInt(value):
        Reads an integer from the start of the string.
        It stops when it reaches a character that is not part of the number.
      */
      const intResult = parseInt(value, 10);

      /*
        parseFloat(value):
        Reads a decimal number from the start of the string.
      */
      const floatResult = parseFloat(value);

      /*
        Number.isNaN() checks whether the result is NaN.
        NaN means Not-a-Number.
      */
      output.textContent =
        `Original input: [${value}]\n\n` +
        `Number(value): ${numberResult}\n` +
        `Number.isNaN(Number(value)): ${Number.isNaN(numberResult)}\n\n` +
        `parseInt(value, 10): ${intResult}\n` +
        `Number.isNaN(parseInt(value, 10)): ${Number.isNaN(intResult)}\n\n` +
        `parseFloat(value): ${floatResult}\n` +
        `Number.isNaN(parseFloat(value)): ${Number.isNaN(floatResult)}`;
    }

    function loadExample(exampleValue) {
      valueInput.value = exampleValue;
      convertValue();
    }

    function clearOutput() {
      output.textContent = "";
    }
  </script>
</body>
</html>
