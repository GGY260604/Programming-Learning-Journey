<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: 04 - slice splice concat.html
    TOPIC: CH07 - Arrays

    GOAL:
    - Learn how slice() extracts part of an array.
    - Learn how splice() changes the original array.
    - Learn how concat() combines arrays without changing the original arrays.

    IMPORTANT:
    - slice() does not change the original array.
    - splice() changes the original array.
    - concat() returns a new combined array.
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CH07 - 04 - slice splice concat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>CH07 - Arrays</h1>
  <h2>04 - slice splice concat</h2>

  <div class="section">
    <h3>Concept</h3>
    <p>
      These methods are useful when you want to copy, remove, insert, or combine array items.
    </p>

    <p>
      The important difference is whether the method changes the original array.
    </p>
  </div>

  <div class="section">
    <h3>Interactive Demo</h3>

    <button onclick="showSlice()">slice()</button>
    <button onclick="showSpliceRemove()">splice() Remove</button>
    <button onclick="showSpliceInsert()">splice() Insert</button>
    <button onclick="showConcat()">concat()</button>
    <button onclick="clearOutput()">Clear</button>

    <div id="output" class="output"></div>
  </div>

  <script>
    const outputBox = document.getElementById("output");

    function print(message) {
      outputBox.textContent += message + "\n";
    }

    function showSlice() {
      const fruits = ["Apple", "Banana", "Orange", "Mango"];

      /*
        slice(start, end) copies part of an array.
        start is included.
        end is not included.
      */
      const selected = fruits.slice(1, 3);

      print("slice() example:");
      print("Original: " + JSON.stringify(fruits));
      print("fruits.slice(1, 3): " + JSON.stringify(selected));
      print("Original after slice: " + JSON.stringify(fruits));
      print("");
    }

    function showSpliceRemove() {
      const fruits = ["Apple", "Banana", "Orange", "Mango"];

      /*
        splice(start, deleteCount) removes items from the original array.
        It returns the removed items.
      */
      const removed = fruits.splice(1, 2);

      print("splice() remove example:");
      print("Removed items: " + JSON.stringify(removed));
      print("Original after splice: " + JSON.stringify(fruits));
      print("");
    }

    function showSpliceInsert() {
      const fruits = ["Apple", "Banana", "Orange"];

      /*
        splice(start, deleteCount, newItem1, newItem2, ...)
        can insert new items if deleteCount is 0.
      */
      fruits.splice(1, 0, "Grape", "Mango");

      print("splice() insert example:");
      print("After insert: " + JSON.stringify(fruits));
      print("");
    }

    function showConcat() {
      const fruits = ["Apple", "Banana"];
      const drinks = ["Tea", "Coffee"];

      /*
        concat() combines arrays and returns a new array.
      */
      const menuItems = fruits.concat(drinks);

      print("concat() example:");
      print("fruits: " + JSON.stringify(fruits));
      print("drinks: " + JSON.stringify(drinks));
      print("menuItems: " + JSON.stringify(menuItems));
      print("");
    }

    function clearOutput() {
      outputBox.textContent = "";
    }
  </script>
</body>
</html>
