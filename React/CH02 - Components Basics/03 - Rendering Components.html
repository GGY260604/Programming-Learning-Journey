<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 - Rendering Components</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .panel {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #f7fbff;
    }
  </style>
</head>
<body>
  <h1>CH02 - 03 - Rendering Components</h1>
  <p>This file shows how to render a component on the page.</p>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    /*
      To render a component, we use it like an HTML tag.

      Example:
      <Welcome />

      React calls the function and displays the returned JSX.
    */

    function LessonCard() {
      return (
        <div className="panel">
          <h2>Rendering a Component</h2>
          <p>
            React is rendering this component into the root container.
          </p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<LessonCard />);
  </script>
</body>
</html>
