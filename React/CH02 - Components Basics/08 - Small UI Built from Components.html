<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>08 - Small UI Built from Components</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      background-color: #f5f5f5;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
    }

    .header, .footer {
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      margin-top: 16px;
    }

    .card-list {
      display: grid;
      gap: 12px;
    }

    .card {
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
    }
  </style>
</head>
<body>
  <h1>CH02 - 08 - Small UI Built from Components</h1>
  <p>This file combines several small components into one mini page.</p>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    /*
      This file shows the practical idea of React:
      build a page by combining many smaller components.
    */

    function Header() {
      return (
        <div className="header">
          <h2>React Learning Dashboard</h2>
          <p>Small UI built using multiple components.</p>
        </div>
      );
    }

    function TopicCard() {
      return (
        <div className="card">
          <h3>Topic Card</h3>
          <p>This card is a reusable component.</p>
        </div>
      );
    }

    function Footer() {
      return (
        <div className="footer">
          <p>End of mini page</p>
        </div>
      );
    }

    function App() {
      return (
        <div className="app">
          <Header />

          <div className="card-list">
            <TopicCard />
            <TopicCard />
            <TopicCard />
          </div>

          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
