<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06 - Organizing UI into Components</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .page {
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 16px;
    }

    .topbar, .sidebar, .main, .bottom {
      padding: 16px;
    }

    .topbar { background-color: #eef6ff; }
    .sidebar { background-color: #f8f8f8; }
    .main { background-color: #ffffff; }
    .bottom { background-color: #f3fff3; }

    .layout {
      display: grid;
      grid-template-columns: 200px 1fr;
    }
  </style>
</head>
<body>
  <h1>CH02 - 06 - Organizing UI into Components</h1>
  <p>This file shows how a larger UI can be split into meaningful parts.</p>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    /*
      Instead of writing one giant component,
      we organize the UI into smaller parts.

      Example:
      - TopBar
      - Sidebar
      - MainContent
      - Footer
    */

    function TopBar() {
      return <div className="topbar"><h2>Top Bar</h2></div>;
    }

    function Sidebar() {
      return (
        <div className="sidebar">
          <h3>Sidebar</h3>
          <p>Menu item 1</p>
          <p>Menu item 2</p>
        </div>
      );
    }

    function MainContent() {
      return (
        <div className="main">
          <h3>Main Content</h3>
          <p>This area contains the main page information.</p>
        </div>
      );
    }

    function Bottom() {
      return (
        <div className="bottom">
          <p>Footer section</p>
        </div>
      );
    }

    function Dashboard() {
      return (
        <div className="page">
          <TopBar />
          <div className="layout">
            <Sidebar />
            <MainContent />
          </div>
          <Bottom />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Dashboard />);
  </script>
</body>
</html>
