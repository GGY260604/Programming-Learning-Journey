<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07 - React vs Plain JavaScript DOM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .section {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .output {
      margin-top: 12px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
    }

    h2 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <h1>CH00 - 07 - React vs Plain JavaScript DOM</h1>
  <p>
    This file compares creating UI with plain JavaScript and with React.
  </p>

  <div class="section">
    <h2>Plain JavaScript DOM</h2>
    <div id="plain-js-output" class="output"></div>
  </div>

  <div class="section">
    <h2>React</h2>
    <div id="root" class="output"></div>
  </div>

  <script>
    /*
      Plain JavaScript DOM approach:
      We manually create elements and append them.
    */
    const plainContainer = document.getElementById("plain-js-output");

    const heading = document.createElement("h3");
    heading.textContent = "Hello from Plain JavaScript";

    const paragraph = document.createElement("p");
    paragraph.textContent = "This UI is built by manually creating DOM nodes.";

    plainContainer.appendChild(heading);
    plainContainer.appendChild(paragraph);
  </script>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    /*
      React approach:
      We describe the UI using JSX.
      React handles the DOM rendering for us.
    */
    function App() {
      return (
        <div>
          <h3>Hello from React</h3>
          <p>This UI is described using JSX and rendered by React.</p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
