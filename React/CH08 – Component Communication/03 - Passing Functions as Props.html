<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>03 - Passing Functions as Props</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      button {
        margin: 5px;
        padding: 8px 14px;
      }
    </style>
  </head>

  <body>
    <h1>CH08 - 03 - Passing Functions as Props</h1>

    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function Button(props) {
        return (
          <button onClick={props.action}>
            {props.label}
          </button>
        );
      }

      function App() {
        function sayHello() {
          alert("Hello!");
        }

        function sayBye() {
          alert("Bye!");
        }

        return (
          <div>
            <Button label="Hello Button" action={sayHello} />
            <Button label="Bye Button" action={sayBye} />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(<App />);
    </script>
  </body>
</html>
