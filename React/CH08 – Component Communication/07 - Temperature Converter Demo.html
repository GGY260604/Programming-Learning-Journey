<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>07 - Temperature Converter Demo</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      input {
        padding: 8px;
        margin: 8px 0;
      }
    </style>
  </head>

  <body>
    <h1>CH08 - 07 - Temperature Converter Demo</h1>

    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function CelsiusInput(props) {
        return (
          <input
            placeholder="Celsius"
            value={props.celsius}
            onChange={(e) => props.setCelsius(e.target.value)}
          />
        );
      }

      function FahrenheitDisplay(props) {
        const fahrenheit =
          props.celsius === ""
            ? ""
            : (props.celsius * 9) / 5 + 32;

        return <p>Fahrenheit: {fahrenheit}</p>;
      }

      function App() {
        const [celsius, setCelsius] = React.useState("");

        return (
          <div>
            <CelsiusInput
              celsius={celsius}
              setCelsius={setCelsius}
            />

            <FahrenheitDisplay celsius={celsius} />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(<App />);
    </script>
  </body>
</html>
