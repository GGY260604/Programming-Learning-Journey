<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>03 - Passing Arguments to Event Handlers</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      button {
        padding: 10px 16px;
        margin: 6px;
      }
    </style>
  </head>

  <body>
    <h1>CH04 - 03 - Passing Arguments to Event Handlers</h1>

    <div id="root"></div>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      /*
        Sometimes we want to send data to the handler.

        We usually use arrow functions.
      */

      function App() {
        function showMessage(name) {
          alert("Hello " + name);
        }

        return (
          <div>
            <h2>Passing Arguments</h2>

            <button onClick={() => showMessage("Alice")}>
              Alice
            </button>

            <button onClick={() => showMessage("Bob")}>
              Bob
            </button>

            <button onClick={() => showMessage("Galen")}>
              Galen
            </button>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(<App />);
    </script>
  </body>
</html>
