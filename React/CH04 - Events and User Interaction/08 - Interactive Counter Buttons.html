<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>08 - Interactive Counter Buttons</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      button {
        padding: 10px 14px;
        margin: 6px;
      }
    </style>
  </head>

  <body>
    <h1>CH04 - 08 - Interactive Counter Buttons</h1>

    <div id="root"></div>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      /*
        This example demonstrates events with state.

        State will be taught in the next chapter.
      */

      function App() {
        const [count, setCount] = React.useState(0);

        function increase() {
          setCount(count + 1);
        }

        function decrease() {
          setCount(count - 1);
        }

        return (
          <div>
            <h2>Counter: {count}</h2>

            <button onClick={increase}>
              Increase
            </button>

            <button onClick={decrease}>
              Decrease
            </button>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(<App />);
    </script>
  </body>
</html>
