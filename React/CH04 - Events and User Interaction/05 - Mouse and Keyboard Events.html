<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>05 - Mouse and Keyboard Events</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      .box {
        padding: 20px;
        background: #eee;
        width: 200px;
        text-align: center;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <h1>CH04 - 05 - Mouse and Keyboard Events</h1>

    <div id="root"></div>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      /*
        React supports many events:

        Mouse
        onClick
        onMouseEnter
        onMouseLeave

        Keyboard
        onKeyDown
        onKeyUp
      */

      function App() {
        function mouseEnter() {
          console.log("Mouse entered");
        }

        function keyPressed(e) {
          console.log("Key:", e.key);
        }

        return (
          <div>
            <div
              className="box"
              onMouseEnter={mouseEnter}
            >
              Hover me
            </div>

            <br />

            <input
              placeholder="Press a key"
              onKeyDown={keyPressed}
            />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(<App />);
    </script>
  </body>
</html>
