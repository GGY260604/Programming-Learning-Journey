<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>01 - onClick Event</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      button {
        padding: 10px 16px;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <h1>CH04 - 01 - onClick Event</h1>

    <div id="root"></div>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      /*
        React handles browser events like:
        - click
        - change
        - keypress
        - mouse events

        In React we use camelCase event names.

        Example:
        onClick
      */

      function App() {
        function sayHello() {
          alert("Hello from React event!");
        }

        return (
          <div>
            <h2>Click the button</h2>

            <button onClick={sayHello}>
              Click Me
            </button>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(<App />);
    </script>
  </body>
</html>
