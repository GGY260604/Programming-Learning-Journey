<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>05 - Self Closing Tags</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .box {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      background-color: #fcfcfc;
    }

    img {
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>CH01 - 05 - Self Closing Tags</h1>
  <p>This file explains self-closing tags in JSX.</p>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    /*
      In JSX, self-closing tags must end with />

      Correct:
      <img />
      <input />
      <br />

      Even if HTML sometimes allows:
      <img>
      JSX requires:
      <img />
    */

    const root = ReactDOM.createRoot(document.getElementById("root"));

    root.render(
      <div className="box">
        <h2>Self Closing Tags</h2>
        <p>This line is above the break tag.</p>
        <br />
        <p>This line is below the break tag.</p>

        <input type="text" placeholder="Type here" />
        <br />
        <img
          src="https://play-media.org/academy/wp-content/uploads/2021/11/urls-1-800x500-1.png"
          alt="Placeholder"
          width="250"
        />
      </div>
    );
  </script>
</body>
</html>
