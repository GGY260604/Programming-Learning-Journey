<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>01 - Why Reusable Logic</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      button {
        margin-right: 8px;
        padding: 8px 14px;
      }
    </style>
  </head>

  <body>
    <h1>CH13 - 01 - Why Reusable Logic</h1>

    <div id="root"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      /*
        Two components both implement
        the same counter logic.

        This duplication is what
        custom hooks solve.
      */

      function CounterA() {
        const [count, setCount] = React.useState(0);

        return (
          <div>
            <h3>Counter A: {count}</h3>

            <button onClick={() => setCount(count + 1)}>
              Increase
            </button>
          </div>
        );
      }

      function CounterB() {
        const [count, setCount] = React.useState(0);

        return (
          <div>
            <h3>Counter B: {count}</h3>

            <button onClick={() => setCount(count + 1)}>
              Increase
            </button>
          </div>
        );
      }

      function App() {
        return (
          <div>
            <CounterA />
            <CounterB />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
