<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>01 - Rendering Lists with map</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }
    </style>
  </head>

  <body>
    <h1>CH06 - 01 - Rendering Lists with map</h1>

    <div id="root"></div>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      /*
        React often needs to render a list of items.

        We usually use JavaScript map() to transform
        an array into JSX elements.
      */

      function App() {
        const fruits = ["Apple", "Banana", "Orange", "Mango"];

        return (
          <div>
            <h2>Fruit List</h2>

            <ul>
              {fruits.map((fruit) => (
                <li>{fruit}</li>
              ))}
            </ul>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(<App />);
    </script>
  </body>
</html>
