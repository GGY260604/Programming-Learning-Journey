<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 - Passing Text Props</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .card {
      margin-top: 12px;
      padding: 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background-color: #fcfcfc;
    }
  </style>
</head>
<body>
  <h1>CH03 - 02 - Passing Text Props</h1>
  <p>This file shows how text values can be passed into components.</p>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    /*
      String props are often passed using quotes.

      Example:
      <UserCard name="Alice" role="Student" />
    */

    function UserCard(props) {
      return (
        <div className="card">
          <h2>{props.name}</h2>
          <p>Role: {props.role}</p>
          <p>Course: {props.course}</p>
        </div>
      );
    }

    function App() {
      return (
        <div>
          <UserCard name="Alice" role="Student" course="React Basics" />
          <UserCard name="Ben" role="Developer" course="Frontend UI" />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
