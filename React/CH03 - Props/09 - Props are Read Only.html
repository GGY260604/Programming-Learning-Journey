<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>09 - Props are Read Only</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      line-height: 1.6;
    }

    .note {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fff8f8;
    }

    code {
      background-color: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>CH03 - 09 - Props are Read Only</h1>
  <p>This file explains an important React rule: props should not be changed by the child.</p>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    /*
      Props are read-only.

      A child component should use props,
      but should not modify them.

      Wrong idea:
      props.name = "New Name";

      Props come from the parent.
      If data needs to change, state is usually used instead.
    */

    function Profile({ name, role }) {
      return (
        <div className="note">
          <h2>{name}</h2>
          <p>Role: {role}</p>
          <p>
            This component reads props and displays them,
            but does not change them.
          </p>
        </div>
      );
    }

    function App() {
      return <Profile name="Galen" role="React Learner" />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
