<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>05 - Destructuring Props</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .card {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #f9fbff;
    }
  </style>
</head>
<body>
  <h1>CH03 - 05 - Destructuring Props</h1>
  <p>This file shows a cleaner way to read props.</p>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    /*
      Instead of writing props.name, props.role, props.course many times,
      we can destructure them.

      Example:
      function UserCard({ name, role }) { ... }
    */

    function CourseCard({ title, teacher, duration }) {
      return (
        <div className="card">
          <h2>{title}</h2>
          <p>Teacher: {teacher}</p>
          <p>Duration: {duration}</p>
        </div>
      );
    }

    function App() {
      return (
        <div>
          <CourseCard title="React Basics" teacher="Sarah" duration="2 weeks" />
          <CourseCard title="Next.js Intro" teacher="David" duration="1 week" />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
