<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>01 - Why State is Needed</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      button {
        padding: 10px;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <h1>CH05 - 01 - Why State is Needed</h1>

    <div id="root"></div>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      /*
        Without state, React components cannot remember values.

        Normal variables will reset every render.
      */

      function App() {
        let count = 0;

        function increase() {
          count++;
          console.log("Count:", count);
        }

        return (
          <div>
            <h2>Count: {count}</h2>

            <button onClick={increase}>
              Increase
            </button>

            <p>
              Clicking the button changes the variable,
              but the UI does NOT update.
            </p>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(<App />);
    </script>
  </body>
</html>
