<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>01 - Normal CSS with React</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      .box {
        border: 1px solid #ccc;
        padding: 16px;
        border-radius: 8px;
        background: #f4f4f4;
      }
    </style>
  </head>

  <body>
    <h1>CH10 - 01 - Normal CSS with React</h1>

    <div id="root"></div>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function App() {
        return (
          <div className="box">
            <h2>Styled with CSS class</h2>
            <p>This component uses normal CSS.</p>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(<App />);
    </script>
  </body>
</html>
